name: Reopen

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: reopen-${{ github.event.issue.number }}

jobs:
  reopen:
    name: Reopen on request
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'closed' &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/reopen')
    runs-on: ubuntu-latest
    steps:
      - name: Reopen the issue when a reason is given
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const { owner, repo } = context.repo;
            const user = context.payload.comment.user.login;
            const reason = process.env.COMMENT_BODY.replace(/^\/reopen\b[:\s-]*/i, '').trim();

            if (reason.length < 10) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `@${user} please add a short reason after \`/reopen\`, for example:\n\n\`/reopen Still happens on 0.89.0-beta: the shop window opens empty after the second purchase.\``
              });
              return;
            }

            await github.rest.issues.update({ owner, repo, issue_number, state: 'open' });

            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes('fixed-next-release')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'fixed-next-release' });
            }
            if (!labels.includes('needs-triage')) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-triage'] });
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `Reopened at the request of @${user}. I'll take another look.`
            });
